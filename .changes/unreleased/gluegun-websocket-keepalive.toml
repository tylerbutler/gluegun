package = "gluegun"
kind = "Fixed"
body = "Apply WebSocket keepalive intervals when opening connections so Gun sends automatic pings. High-level connect and with_socket route with_keepalive to connection options, with explicit upgrade settings taking precedence. For low-level upgrades, use connection.with_websocket_keepalive before open; upgrade-only keepalive settings now return InvalidOptions instead of silently leaving the timer unchanged. The default remains no automatic pings."
