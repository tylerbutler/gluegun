name = "gluegun"
version = "0.2.0"
description = "A Gleam wrapper for the Erlang Gun HTTP client"
licences = ["MIT"]
repository = { type = "github", user = "tylerbutler", repo = "gluegun" }
gleam = ">= 1.11.0"
target = "erlang"
internal_modules = [
  "gluegun/internal",
  "gluegun/websocket/raw",
]

[dependencies]
gleam_stdlib = ">= 0.53.0 and < 2.0.0"
gleam_erlang = ">= 1.0.0 and < 2.0.0"
gleam_http = ">= 4.0.0 and < 5.0.0"
gun = ">= 2.1.0 and < 3.0.0"

[dev-dependencies]
unitest = ">= 1.6.1 and < 2.0.0"

[tools.trellis]
members = [".", "examples/*"]

[tools.trellis.exclude]
docs = ["examples/*"]
examples-deps = ["."]
examples-format = ["."]
examples-format-check = ["."]
examples-test = ["."]
examples-build = ["."]

[tools.trellis.tasks.examples-deps]
command = "gleam deps download"

[tools.trellis.tasks.examples-format]
command = "if [ -d test ]; then gleam format src test; else gleam format src; fi"

[tools.trellis.tasks.examples-format-check]
command = "if [ -d test ]; then gleam format --check src test; else gleam format --check src; fi"

[tools.trellis.tasks.examples-test]
command = "if [ -d test ]; then gleam test; fi"

[tools.trellis.tasks.examples-build]
command = """
gleam build &&
if grep -q '^gleescript ' gleam.toml || grep -q '^gleescript ' manifest.toml 2>/dev/null; then
  gleam run -m gleescript -- --out=dist
fi
"""

[tools.trellis.changelog]
header_format = "# Changelog"
version_format = "## {{ version }} - {{ date }}"
kind_format = "### {{ kind }}"
change_format = "#### {{ body }}"
kinds = [
  { label = "Major Release", bump = "major" },
  { label = "Breaking", bump = "major" },
  { label = "Added", bump = "minor" },
  { label = "Changed", bump = "patch" },
  { label = "Deprecated", bump = "patch" },
  { label = "Fixed", bump = "patch" },
  { label = "Performance", bump = "patch" },
  { label = "Removed", bump = "patch" },
  { label = "Reverted", bump = "patch" },
  { label = "Dependencies", bump = "patch" },
  { label = "Security", bump = "patch" },
]

[tools.trellis.publish]
exact_tag_format = "v{version}"
package_tags = ["exact"]

[tools.trellis.publish.lifecycle]
default = "git_only"
packages = { "examples/*" = "workspace" }
