name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    name: Select checks
    outputs:
      full: ${{ github.event_name != 'pull_request' || steps.select.outputs.full == 'true' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Select checks
        if: github.event_name == 'pull_request'
        id: select
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # ratchet:dorny/paths-filter@v3
        with:
          token: ""
          base: ${{ github.event.pull_request.base.sha }}
          predicate-quantifier: every
          filters: |
            full:
              - '!.agents/skills/**'
              - '!.claude/skills/**'
              - '!.claude/commands/**'
              - '!.github/skills/**'
              - '!.changes/**/*.md'
              - '!.changes/**/*.toml'
              - '!CHANGELOG.md'

  library:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    name: Library
    steps:
      - name: Require successful check selection
        if: needs.changes.result != 'success'
        run: exit 1

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6

      - name: Setup environment
        uses: ./.github/actions/setup
        with:
          dependencies: ${{ needs.changes.outputs.full }}

      - name: Run CI checks
        if: needs.changes.outputs.full == 'true'
        run: just ci-library

      - name: Validate workspace metadata
        if: needs.changes.outputs.full == 'false'
        run: just trellis-doctor

  examples:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    name: Examples
    steps:
      - name: Require successful check selection
        if: needs.changes.result != 'success'
        run: exit 1

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
        if: needs.changes.outputs.full == 'true'

      - name: Setup environment
        if: needs.changes.outputs.full == 'true'
        uses: ./.github/actions/setup
        with:
          examples: "true"

      - name: Validate standalone examples
        if: needs.changes.outputs.full == 'true'
        run: just ci-examples

  test:
    needs: [changes, library, examples]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    name: Test
    steps:
      - name: Require library and example checks
        env:
          SELECTION_RESULT: ${{ needs.changes.result }}
          LIBRARY_RESULT: ${{ needs.library.result }}
          EXAMPLES_RESULT: ${{ needs.examples.result }}
        run: |
          test "$SELECTION_RESULT" = success
          test "$LIBRARY_RESULT" = success
          test "$EXAMPLES_RESULT" = success

  compatibility:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    name: Compatibility (${{ matrix.resolution }})
    env:
      GLEAM_VERSION: ${{ matrix.gleam }}
      ERLANG_VERSION: ${{ matrix.erlang }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - resolution: minimum
            gleam: "1.11.0"
            erlang: "27.0"
          - resolution: current
            gleam: "1.19.2"
            erlang: "29.1"
    steps:
      - name: Require successful check selection
        if: needs.changes.result != 'success'
        run: exit 1

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
        if: needs.changes.outputs.full == 'true'

      - name: Setup tools without package development dependencies
        if: needs.changes.outputs.full == 'true'
        id: setup
        uses: ./.github/actions/setup
        with:
          dependencies: "false"

      - name: Cache supported compiler and runtime
        if: needs.changes.outputs.full == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6
        with:
          path: |
            ~/.local/share/mise/installs/gleam/${{ matrix.gleam }}
            ~/.local/share/mise/installs/erlang/${{ matrix.erlang }}
          key: mise-matrix-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup.outputs.platform }}-${{ matrix.gleam }}-${{ matrix.erlang }}-${{ hashFiles('.mise.toml', 'mise.lock') }}

      - name: Select supported compiler and runtime
        if: needs.changes.outputs.full == 'true'
        run: |
          mise install "gleam@$GLEAM_VERSION" "erlang@$ERLANG_VERSION"
          actual_gleam="$(mise exec "gleam@$GLEAM_VERSION" "erlang@$ERLANG_VERSION" -- gleam --version)"
          actual_erlang="$(mise exec "gleam@$GLEAM_VERSION" "erlang@$ERLANG_VERSION" -- erl -noshell -eval '
            {ok, Version} = file:read_file(filename:join([code:root_dir(), "releases", erlang:system_info(otp_release), "OTP_VERSION"])),
            io:format("~s", [string:trim(Version)]), halt().')"
          echo "$actual_gleam / OTP $actual_erlang"
          test "$actual_gleam" = "gleam $GLEAM_VERSION"
          test "$actual_erlang" = "$ERLANG_VERSION"

      - name: Select exact minimum production dependencies
        if: needs.changes.outputs.full == 'true' && matrix.resolution == 'minimum'
        working-directory: compatibility
        run: |
          sed -i 's/gleam_stdlib = .*/gleam_stdlib = ">= 0.53.0 and <= 0.53.0"/' gleam.toml
          sed -i 's/gleam_erlang = .*/gleam_erlang = ">= 1.0.0 and <= 1.0.0"/' gleam.toml
          sed -i 's/gleam_http = .*/gleam_http = ">= 4.0.0 and <= 4.0.0"/' gleam.toml
          sed -i 's/^gun = .*/gun = ">= 2.1.0 and <= 2.1.0"/' gleam.toml

      - name: Build and exercise public consumer APIs
        if: needs.changes.outputs.full == 'true'
        working-directory: compatibility
        run: |
          mise exec "gleam@$GLEAM_VERSION" "erlang@$ERLANG_VERSION" -- gleam build --warnings-as-errors
          mise exec "gleam@$GLEAM_VERSION" "erlang@$ERLANG_VERSION" -- gleam run

      - name: Exercise HTTP/2 and TLS wire contracts with current dependencies
        if: needs.changes.outputs.full == 'true' && matrix.resolution == 'current'
        run: |
          mise exec "gleam@$GLEAM_VERSION" "erlang@$ERLANG_VERSION" -- gleam deps update
          mise exec "gleam@$GLEAM_VERSION" "erlang@$ERLANG_VERSION" -- gleam test -- test/bounded_streaming_test.gleam

  docs:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    name: Docs
    steps:
      - name: Require successful check selection
        if: needs.changes.result != 'success'
        run: exit 1

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
        if: needs.changes.outputs.full == 'true'

      - name: Setup environment
        if: needs.changes.outputs.full == 'true'
        uses: ./.github/actions/setup

      - name: Build documentation
        if: needs.changes.outputs.full == 'true'
        run: just docs

  website:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    name: Website
    steps:
      - name: Require successful check selection
        if: needs.changes.result != 'success'
        run: exit 1

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
        if: needs.changes.outputs.full == 'true'

      - name: Setup environment
        if: needs.changes.outputs.full == 'true'
        uses: ./.github/actions/setup

      - name: Cache pnpm dependencies
        if: needs.changes.outputs.full == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('website/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install website dependencies
        if: needs.changes.outputs.full == 'true'
        run: pnpm install --frozen-lockfile
        working-directory: website

      - name: Check committed references
        if: needs.changes.outputs.full == 'true'
        run: pnpm test:reference && pnpm check:reference
        working-directory: website

      - name: Check Astro website
        if: needs.changes.outputs.full == 'true'
        run: just site-check

      - name: Build website
        if: needs.changes.outputs.full == 'true'
        run: just site-build
