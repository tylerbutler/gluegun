name: Trellis Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pre:
        description: "Enter a candidate cycle (rc), promote (none), or prepare stable (empty)"
        type: string
        default: ""
      version:
        description: "Target version before the prerelease suffix (for example, 1.0.0)"
        type: string
        default: ""

concurrency:
  group: trellis-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # ratchet:actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup tools
        uses: ./.github/actions/setup
        with:
          dependencies: "false"

      - name: Create or update release PR
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          INPUT_PRE: ${{ inputs.pre }}
          INPUT_VERSION: ${{ inputs.version }}
        run: mise exec -- python3 -B scripts/release_pr.py
